<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TerraNova Store — Снаряжение & Авторские экспедиции</title>
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
  <link rel="stylesheet" href="../src/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="bg-[#f7faf8] text-slate-800 dark:bg-[#0b1512] dark:text-slate-100 min-h-screen flex flex-col antialiased bg-topo-pattern">
  <div data-vue-header data-active-page="ecommerce" data-base-path=".." data-subtitle="Outdoor & Gear" data-show-cart="true"></div>
  <div data-vue-catalog class="flex-1 flex flex-col"></div>
  <script type="module" src="../src/js/main.js"></script>
</body>
</html>
